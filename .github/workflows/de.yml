name: Frontend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: All model, store and source regression tests
        run: npm test
      - run: npm run build

  browser-results:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify shared results in Chromium
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/protangram-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:5173/ > /dev/null
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-results-browser
          path: |
            frontend/node_modules/.tmp/analysis-results
            frontend/node_modules/.tmp/professional-interactions
            /tmp/protangram-vite.log
          if-no-files-found: warn
