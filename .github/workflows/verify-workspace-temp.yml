name: Verify Workspace Refactor

on:
  push:
    branches:
      - refactor/workbench-project-tree-ui

jobs:
  workspace:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Project workspace model tests
        run: node --experimental-strip-types --test tests/projectWorkspaceModel.test.ts
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
