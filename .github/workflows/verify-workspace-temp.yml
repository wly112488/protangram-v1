name: Verify Workspace Refactor

on:
  push:
    branches:
      - refactor/workbench-project-tree-ui

jobs:
  workspace:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Workspace regression tests
        run: node --experimental-strip-types --test tests/*.test.ts
      - name: Build
        run: npm run build
      - name: Lint workspace refactor
        run: >-
          npx eslint
          src/components/TrialAIAssistant.tsx
          src/layouts/MainLayout.tsx
          src/pages/analysis/DigitalTwin.tsx
          src/pages/analysis/VirtualConditionExtension.tsx
          src/pages/analysis/projects/AnalysisProjects.tsx
          src/pages/experiment/design/IntelligentExperimentDesign.tsx
          src/types/businessContext.ts
          src/workbench/FunctionBar.tsx
          src/workspace
