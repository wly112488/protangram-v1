<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff" />
      <stop offset="100%" stop-color="#fdfefe" />
    </linearGradient>
    <linearGradient id="headerFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eaf4ff" />
      <stop offset="55%" stop-color="#f7fbff" />
      <stop offset="100%" stop-color="#eef9f2" />
    </linearGradient>
    <linearGradient id="blueBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3f8cff" />
      <stop offset="100%" stop-color="#7db6ff" />
    </linearGradient>
    <linearGradient id="greenBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#35b36f" />
      <stop offset="100%" stop-color="#7bd7a5" />
    </linearGradient>
    <linearGradient id="orangeBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9f43" />
      <stop offset="100%" stop-color="#ffcf7c" />
    </linearGradient>
    <linearGradient id="purpleBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8d6bff" />
      <stop offset="100%" stop-color="#bfadff" />
    </linearGradient>
    <linearGradient id="pinkBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef6a9a" />
      <stop offset="100%" stop-color="#f8adc7" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#9fb4c7" flood-opacity="0.18"/>
    </filter>
    <marker id="flowArrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#6f8fb6" />
    </marker>
    <style>
      .title { font: 700 40px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #1d2b3a; }
      .subtitle { font: 400 18px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #5e6e80; }
      .sectionTitle { font: 700 26px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #1e3147; }
      .cardTitle { font: 700 24px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #203248; }
      .cardSub { font: 700 17px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #35506d; }
      .bodyText { font: 400 16px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #596c81; }
      .badgeText { font: 700 17px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #ffffff; }
      .miniTitle { font: 700 16px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #27415f; }
      .miniText { font: 400 15px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #64758a; }
      .footerText { font: 400 15px 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; fill: #718397; }
    </style>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="url(#bgGlow)" />
  <circle cx="1620" cy="130" r="220" fill="#edf6ff" opacity="0.9"/>
  <circle cx="1760" cy="880" r="200" fill="#f3f8ff" opacity="0.8"/>
  <circle cx="180" cy="980" r="190" fill="#eef9f4" opacity="0.7"/>

  <rect x="52" y="38" width="1816" height="132" rx="28" fill="url(#headerFill)" stroke="#d9e8f5" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="88" y="95" class="title">ProTangram 工业试验数据数智化分析平台</text>
  <text x="88" y="131" class="subtitle">汇报级功能架构图 · 面向“试验管理—数据分析—报告输出”全流程的工业试验业务闭环平台</text>
  <rect x="1450" y="68" width="122" height="36" rx="18" fill="#ffffff" stroke="#dbe8f4"/>
  <text x="1479" y="91" class="miniTitle">版本 v1.0</text>
  <rect x="1592" y="68" width="112" height="36" rx="18" fill="#ffffff" stroke="#dbe8f4"/>
  <text x="1614" y="91" class="miniTitle">白底汇报版</text>
  <rect x="1720" y="68" width="116" height="36" rx="18" fill="#ffffff" stroke="#dbe8f4"/>
  <text x="1748" y="91" class="miniTitle">可直接贴PPT</text>

  <rect x="60" y="206" width="360" height="794" rx="28" fill="#ffffff" stroke="#dce8f3" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="92" y="258" class="sectionTitle">平台价值定位</text>
  <rect x="92" y="286" width="296" height="3" rx="2" fill="#dce8f5"/>
  <text x="92" y="336" class="cardSub">1. 面向对象</text>
  <text x="112" y="367" class="bodyText">• 工业试验管理人员</text>
  <text x="112" y="396" class="bodyText">• 数据分析与算法应用人员</text>
  <text x="112" y="425" class="bodyText">• 报告编制与结果交付人员</text>

  <text x="92" y="485" class="cardSub">2. 核心目标</text>
  <text x="112" y="516" class="bodyText">• 统一试验基础数据与流程</text>
  <text x="112" y="545" class="bodyText">• 规范数据分析模板与执行</text>
  <text x="112" y="574" class="bodyText">• 支撑标准报告生成与沉淀</text>

  <text x="92" y="634" class="cardSub">3. 业务闭环</text>
  <text x="112" y="665" class="bodyText">• 信息管理</text>
  <text x="112" y="694" class="bodyText">• 试验设计</text>
  <text x="112" y="723" class="bodyText">• 模板搭建</text>
  <text x="112" y="752" class="bodyText">• 数据分析执行</text>
  <text x="112" y="781" class="bodyText">• 报告生成</text>

  <text x="92" y="841" class="cardSub">4. 支撑特点</text>
  <text x="112" y="872" class="bodyText">• 本地持久化存储</text>
  <text x="112" y="901" class="bodyText">• 统一计算接口解耦</text>
  <text x="112" y="930" class="bodyText">• 大文件分块读取</text>
  <text x="112" y="959" class="bodyText">• AI辅助接口预留</text>

  <rect x="462" y="206" width="1398" height="146" rx="28" fill="#ffffff" stroke="#dce8f3" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="502" y="255" class="sectionTitle">核心流程链路</text>

  <rect x="505" y="279" width="196" height="42" rx="21" fill="url(#blueBadge)"/>
  <text x="553" y="306" class="badgeText">1 信息管理</text>
  <line x1="701" y1="300" x2="774" y2="300" stroke="#6f8fb6" stroke-width="4" marker-end="url(#flowArrow)"/>

  <rect x="786" y="279" width="196" height="42" rx="21" fill="url(#greenBadge)"/>
  <text x="836" y="306" class="badgeText">2 试验设计</text>
  <line x1="982" y1="300" x2="1055" y2="300" stroke="#6f8fb6" stroke-width="4" marker-end="url(#flowArrow)"/>

  <rect x="1067" y="279" width="196" height="42" rx="21" fill="url(#orangeBadge)"/>
  <text x="1115" y="306" class="badgeText">3 模板搭建</text>
  <line x1="1263" y1="300" x2="1336" y2="300" stroke="#6f8fb6" stroke-width="4" marker-end="url(#flowArrow)"/>

  <rect x="1348" y="279" width="218" height="42" rx="21" fill="url(#purpleBadge)"/>
  <text x="1392" y="306" class="badgeText">4 数据分析执行</text>
  <line x1="1566" y1="300" x2="1634" y2="300" stroke="#6f8fb6" stroke-width="4" marker-end="url(#flowArrow)"/>

  <rect x="1644" y="279" width="170" height="42" rx="21" fill="url(#pinkBadge)"/>
  <text x="1687" y="306" class="badgeText">5 报告生成</text>

  <rect x="462" y="386" width="430" height="292" rx="26" fill="#ffffff" stroke="#bcd6f7" stroke-width="2" filter="url(#cardShadow)"/>
  <rect x="462" y="386" width="430" height="58" rx="26" fill="#edf5ff"/>
  <circle cx="510" cy="415" r="20" fill="url(#blueBadge)"/>
  <text x="503" y="422" class="badgeText">1</text>
  <text x="544" y="422" class="cardTitle">试验管理</text>
  <text x="498" y="482" class="cardSub">信息管理</text>
  <text x="520" y="512" class="bodyText">• 装备管理：BOM层级展示、上传、编辑</text>
  <text x="520" y="540" class="bodyText">• 试验科目：条目与对象基础信息维护</text>
  <text x="520" y="568" class="bodyText">• 试验设计方法：方法库维护与调用</text>
  <text x="520" y="596" class="bodyText">• 采样要求：已预留扩展入口</text>
  <text x="498" y="639" class="cardSub">试验设计</text>
  <text x="520" y="669" class="bodyText">• 试验卡片新建、编辑、删除、列表管理</text>
  <text x="520" y="697" class="bodyText">• 大纲设计五步法：方法/参数/因子/响应/方案</text>

  <rect x="946" y="386" width="430" height="292" rx="26" fill="#ffffff" stroke="#c8e9cf" stroke-width="2" filter="url(#cardShadow)"/>
  <rect x="946" y="386" width="430" height="58" rx="26" fill="#eefaf1"/>
  <circle cx="994" cy="415" r="20" fill="url(#greenBadge)"/>
  <text x="987" y="422" class="badgeText">2</text>
  <text x="1028" y="422" class="cardTitle">数据分析</text>
  <text x="982" y="482" class="cardSub">模块与模板</text>
  <text x="1004" y="512" class="bodyText">• 模块管理：数据/计算/对比/绘图模块</text>
  <text x="1004" y="540" class="bodyText">• 计算能力：5类、24种算法</text>
  <text x="1004" y="568" class="bodyText">• React Flow拖拽式模板搭建与持久化</text>
  <text x="982" y="611" class="cardSub">执行与输出</text>
  <text x="1004" y="641" class="bodyText">• CSV导入、流程高亮执行、对比分析</text>
  <text x="1004" y="669" class="bodyText">• OUT输出节点支持URL面板全屏查看</text>
  <text x="1004" y="697" class="bodyText">• 结果可进入后续报告编制流程</text>

  <rect x="1430" y="386" width="430" height="292" rx="26" fill="#ffffff" stroke="#dcccf8" stroke-width="2" filter="url(#cardShadow)"/>
  <rect x="1430" y="386" width="430" height="58" rx="26" fill="#f5f1ff"/>
  <circle cx="1478" cy="415" r="20" fill="url(#purpleBadge)"/>
  <text x="1471" y="422" class="badgeText">3</text>
  <text x="1512" y="422" class="cardTitle">报告生成</text>
  <text x="1466" y="482" class="cardSub">模板与管理</text>
  <text x="1488" y="512" class="bodyText">• 读取Word模板库，当前内置多种模板</text>
  <text x="1488" y="540" class="bodyText">• 报告新建、顺延生成、列表维护</text>
  <text x="1466" y="583" class="cardSub">生成与交付</text>
  <text x="1488" y="613" class="bodyText">• 标签解析、数据绑定、生成预览</text>
  <text x="1488" y="641" class="bodyText">• 标准化试验分析报告形成与输出</text>
  <text x="1488" y="669" class="bodyText">• 服务于成果归档与结果交付</text>

  <rect x="462" y="716" width="670" height="284" rx="26" fill="#ffffff" stroke="#d8e5ef" stroke-width="2" filter="url(#cardShadow)"/>
  <rect x="462" y="716" width="670" height="58" rx="26" fill="#f4f8fb"/>
  <text x="500" y="753" class="cardTitle">平台支撑能力</text>
  <text x="500" y="816" class="cardSub">前端体验与交互</text>
  <text x="522" y="846" class="bodyText">• 首页三大模块入口、快捷按钮、工作流程指引</text>
  <text x="522" y="874" class="bodyText">• Chrome风格页签栏、用户区、地址感知布局</text>
  <text x="522" y="902" class="bodyText">• 亮色/工业深色主题切换，适配演示与长期使用</text>
  <text x="522" y="930" class="bodyText">• 面板圆角、对齐优化、默认无滚动条的专业界面体验</text>
  <text x="500" y="972" class="cardSub">数据持久化</text>
  <text x="522" y="1002" class="bodyText">• 实验、模板、项目、报告均采用本地JSON持久化管理</text>

  <rect x="1160" y="716" width="700" height="284" rx="26" fill="#ffffff" stroke="#d8e5ef" stroke-width="2" filter="url(#cardShadow)"/>
  <rect x="1160" y="716" width="700" height="58" rx="26" fill="#f4f8fb"/>
  <text x="1198" y="753" class="cardTitle">后端与数据能力</text>
  <text x="1198" y="816" class="cardSub">基础服务接口</text>
  <text x="1220" y="846" class="bodyText">• CSV读取：BOM / test / testmethod</text>
  <text x="1220" y="874" class="bodyText">• CRUD接口：experiments / templates / projects / reports</text>
  <text x="1220" y="902" class="bodyText">• 报告模板接口：/api/report-templates</text>
  <text x="1220" y="930" class="bodyText">• 大文件分块读取：/api/data/read-chunk</text>
  <text x="1198" y="972" class="cardSub">计算与扩展</text>
  <text x="1220" y="1002" class="bodyText">• 统一计算代理 /api/compute/:moduleId/:algId，支持过程数据追溯与AI接口预留</text>

  <line x1="677" y1="678" x2="677" y2="706" stroke="#93a5b8" stroke-width="3" marker-end="url(#flowArrow)"/>
  <line x1="1161" y1="678" x2="1161" y2="706" stroke="#93a5b8" stroke-width="3" marker-end="url(#flowArrow)"/>
  <line x1="1645" y1="678" x2="1645" y2="706" stroke="#93a5b8" stroke-width="3" marker-end="url(#flowArrow)"/>

  <text x="60" y="1044" class="footerText">说明：本图依据当前工程路由、README、首页导航、后端接口与既有功能实现整理，采用白底PPT风格，可直接嵌入汇报材料。</text>
</svg>
