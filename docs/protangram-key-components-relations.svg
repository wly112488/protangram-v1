  <text x="1418" y="610" class="body">- experiments/*.json</text>
  <text x="1418" y="636" class="body">- templates/*.json</text>
  <text x="1418" y="662" class="body">- projects/*.json</text>
  <text x="1418" y="688" class="body">- reports/*.json</text>
  <text x="1608" y="610" class="body">- process_data/*.json</text>
  <text x="1608" y="636" class="body">- Word 模板目录 wordreporttemplate</text>
