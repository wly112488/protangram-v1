  <text x="118" y="698" class="body">- React Flow 拖拽搭建模板</text>
  <text x="118" y="722" class="body">- 节点双击配置输入/输出参数</text>
  <text x="118" y="746" class="body">- 保存 AnalysisTemplate</text>

  <rect x="420" y="616" width="380" height="198" rx="18" fill="#f8fbff" stroke="#cddff1"/>
