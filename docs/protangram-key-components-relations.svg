  <text x="804" y="566" class="small">统一依赖：useAppStore + storage.ts；由 router + MainLayout + Outlet 进行装载与分发</text>

  <rect x="96" y="616" width="280" height="132" rx="18" fill="#f8fbff" stroke="#cddff1"/>
  <rect x="96" y="616" width="74" height="30" rx="15" fill="url(#blue)"/>
  <text x="124" y="636" class="white">模板设计</text>
