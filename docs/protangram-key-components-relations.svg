  <text x="444" y="722" class="body">- 生成执行顺序并高亮当前节点</text>
  <text x="444" y="746" class="body">- 数据导入 / 对比分析 / 输出变量设置</text>
  <text x="444" y="770" class="body">- 推进 completedNodes 并保存项目进度</text>
  <rect x="680" y="778" width="94" height="24" rx="12" fill="#f0f5ff" stroke="#c9daf7"/>
  <text x="698" y="794" class="mini">调用 FullscreenPanel</text>

  <rect x="844" y="616" width="200" height="132" rx="18" fill="#f8fbff" stroke="#cddff1"/>
