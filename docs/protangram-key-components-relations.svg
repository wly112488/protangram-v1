  <text x="1418" y="337" class="body">- Express 服务主入口</text>
  <text x="1418" y="363" class="body">- experiments / templates / projects / reports CRUD</text>
  <text x="1418" y="389" class="body">- /api/report-templates</text>
  <text x="1418" y="415" class="body">- /api/compute/:moduleId/:algId</text>
  <text x="1418" y="441" class="body">- /api/data/read-chunk</text>
