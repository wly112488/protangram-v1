  <text x="1418" y="832" class="body">- 为首页初始化同步提供数据源</text>
  <text x="1418" y="858" class="body">- 为模板、项目、报告保存提供持久化能力</text>
  <text x="1418" y="884" class="body">- 为后续真实算法服务、AI扩展预留接口</text>

  <rect x="60" y="530" width="1260" height="430" rx="26" fill="#ffffff" stroke="#dce8f3" stroke-width="2" filter="url(#shadow)"/>
  <rect x="60" y="530" width="1260" height="56" rx="26" fill="#eef6ff"/>
