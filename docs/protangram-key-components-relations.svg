  <line x1="240" y1="328" x2="240" y2="356" stroke="#6b87ab" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="94" y="364" width="292" height="92" rx="16" fill="#f8fbff" stroke="#cddff1"/>
