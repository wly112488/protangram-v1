  <text x="86" y="128" class="subtitle">基于当前工程实际代码整理：入口层、路由布局层、状态与桥接层、核心业务页面、后端与数据落盘层，以及 ExperimentCard / AnalysisTemplate / AnalysisProject / AnalysisReport 主业务对象关系</text>

