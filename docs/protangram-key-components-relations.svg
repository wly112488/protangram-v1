  <text x="866" y="698" class="body">- 选择分析项目与报告模板</text>
  <text x="866" y="722" class="body">- 生成 AnalysisReport</text>
  <text x="866" y="746" class="body">- 跳转报告生成页</text>

  <rect x="1084" y="616" width="200" height="132" rx="18" fill="#f8fbff" stroke="#cddff1"/>
  <rect x="1084" y="616" width="78" height="30" rx="15" fill="url(#pink)"/>
  <text x="1114" y="636" class="white">报告生成</text>
  <text x="1106" y="672" class="cardTitle">ReportGenerate.tsx</text>
  <text x="1106" y="698" class="body">- 标签绑定输出变量</text>
  <text x="1106" y="722" class="body">- 保存 tagBindings</text>
  <text x="1106" y="746" class="body">- 更新报告状态 generated</text>

  <rect x="120" y="804" width="1100" height="112" rx="18" fill="#fbfdff" stroke="#d7e4f1"/>
  <text x="146" y="836" class="cardTitle">页面内部/页面之间的关键调用链</text>
  <text x="146" y="864" class="body">TemplateCreate 保存模板 → storage.saveAnalysisTemplates() → services/api.saveTemplate() → backend /api/templates</text>
  <text x="146" y="890" class="body">AnalysisExecution 完成节点 → updateAnalysisProject() + saveAnalysisProjects() → backend /api/projects</text>
  <text x="146" y="916" class="body">AnalysisExecution 全部完成 → 跳转 ReportCreate → 创建报告 → ReportGenerate 绑定并生成</text>

  <line x1="378" y1="682" x2="412" y2="682" stroke="#6b87ab" stroke-width="3" marker-end="url(#arrow)"/>
