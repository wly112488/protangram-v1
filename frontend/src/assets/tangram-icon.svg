<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .tangram-line { fill: none; stroke: #1890ff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .tangram-circle { fill: none; stroke: #1890ff; stroke-width: 2; }
    </style>
  </defs>
  
  <!-- 外框 -->
  <rect x="10" y="10" width="80" height="80" class="tangram-line" rx="4"/>
  
  <!-- 三角形分割线 -->
  <path d="M10 10 L50 50 L90 10" class="tangram-line"/>
  <path d="M10 90 L50 50 L90 90" class="tangram-line"/>
  <path d="M50 10 L50 90" class="tangram-line"/>
  <path d="M10 50 L90 50" class="tangram-line"/>
  
  <!-- 数据节点圆圈 -->
  <circle cx="25" cy="35" r="3" class="tangram-circle"/>
  <circle cx="75" cy="35" r="3" class="tangram-circle"/>
  <circle cx="25" cy="65" r="3" class="tangram-circle"/>
  <circle cx="75" cy="65" r="3" class="tangram-circle"/>
  <circle cx="40" cy="75" r="3" class="tangram-circle"/>
  <circle cx="60" cy="75" r="3" class="tangram-circle"/>
  
  <!-- 连接线 -->
  <path d="M25 35 L40 35 L40 50" class="tangram-line"/>
  <path d="M75 35 L60 35 L60 50" class="tangram-line"/>
  <path d="M40 75 L50 75 L60 75" class="tangram-line"/>
</svg>
